[package]
name = "ufo-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Lightning-fast universal file format sniffer, decoder, and structural inspector in pure Rust"

[features]
default = []

[dependencies]
base64 = "0.23"
brotli = "9.1"
byteorder = "1.5"
cadmpeg-codec-freecad = "0.6.3"
cadmpeg-codec-rhino = "0.6.3"
cadmpeg-codec-step = "0.6.3"
cadmpeg-core = "0.6.3"
cadmpeg-ir = "0.6.3"
cfb = "0.14"
chardetng = "0.1"
crc32fast = "1.5"
encoding_rs = "0.8"
exr = { version = "1.74", default-features = false }
flate2 = { version = "1.1", default-features = false, features = ["rust_backend"] }
gltf = { version = "1.4", default-features = false, features = ["utils", "names", "extras"] }
hex = "0.4"
image = { version = "0.25", default-features = false, features = ["bmp", "dds", "ff", "gif", "hdr", "ico", "jpeg", "png", "pnm", "qoi", "tga", "tiff", "webp"] }
infer = "0.22"
plist = "1.10"
quick-xml = "0.42"
ron = "0.12"
roxmltree = "0.21"
ruzstd = "0.9"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha1 = "0.11"
sha2 = "0.11"
simdutf8 = "0.1"
thiserror = "2.0"
toml = "1.2"
ttf-parser = "0.25"
zip = { version = "9.0", default-features = false, features = ["deflate-flate2"] }
zune-inflate = "0.2"
