[package]
name = "ufo-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Lightning-fast universal file format sniffer, decoder, and structural inspector in pure Rust"

[features]
default = []

[dependencies]
av1oxide = "0.4"
base64 = "0.23"
brotli = "9.1"
byteorder = "1.5"
cadmpeg-core = "=0.6.12"
cadmpeg-ir = "=0.6.12"
cadmpeg-registry = { version = "=0.6.12", default-features = false, features = ["fcstd", "iges", "rhino", "step", "usd"] }
cfb = "0.14"
chardetng = "0.1"
crc32fast = "1.5"
encoding_rs = "0.8"
exr = { version = "1.74", default-features = false }
fbxcel = { version = "0.9", features = ["tree"] }
flate2 = { version = "1.1", default-features = false, features = ["rust_backend"] }
gltf = { version = "1.4", default-features = false, features = ["utils", "names", "extras"] }
hayro-jpeg2000 = { version = "0.5", default-features = false, features = ["std", "image"] }
hex = "0.4"
image = { version = "0.25", default-features = false, features = ["bmp", "dds", "ff", "gif", "hdr", "ico", "jpeg", "png", "pnm", "qoi", "tga", "tiff", "webp"] }
infer = "0.22"
jxl-oxide = { version = "0.12", default-features = false, features = ["image", "moxcms"] }
plist = "1.10"
quick-xml = "0.42"
ron = "0.12"
roxmltree = "0.21"
ruzstd = "0.9"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha1 = "0.11"
sha2 = "0.11"
simdutf8 = "0.1"
solidcore = { git = "https://github.com/tangency-labs/solidcore.git", branch = "main" }
solidcore-cadir = { git = "https://github.com/tangency-labs/solidcore.git", branch = "main" }
solidcore-ops = { git = "https://github.com/tangency-labs/solidcore.git", branch = "main" }
solidcore-record = { git = "https://github.com/tangency-labs/solidcore.git", branch = "main" }
solidcore-step = { git = "https://github.com/tangency-labs/solidcore.git", branch = "main" }
solidcore-tess = { git = "https://github.com/tangency-labs/solidcore.git", branch = "main" }
thiserror = "2.0"
toml = "1.2"
ttf-parser = "0.25"
zip = { version = "9.0", default-features = false, features = ["deflate-flate2"] }
zune-inflate = "0.2"
